name: Release

# Every push to main that changes code becomes a release: a new patch tag and a
# public multi-arch image for self-hosters. Nothing is committed to main (it's
# protected), and nothing here deploys: a build-from-source stack redeploys on the
# repo's push webhook.
on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'tests/**'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    permissions:
      contents: write   # push the tag
      packages: write   # push the image
    env:
      FASTMCP_MCP_CAMELCASE_COMPAT: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Test
        run: |
          uv sync --locked
          uv run pytest -x

      - name: Tag release
        id: version
        # The first release is pyproject's version; after that, the latest v* tag
        # plus one patch. A re-run reuses HEAD's tag. A tag pushed with
        # GITHUB_TOKEN triggers no other workflow.
        run: |
          NEW=$(git tag --points-at HEAD --list 'v*' --sort=-v:refname | head -1)
          if [ -z "$NEW" ]; then
            LAST=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
            if [ -z "$LAST" ]; then
              NEW="v$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)"
            else
              IFS='.' read -r MAJOR MINOR PATCH <<< "${LAST#v}"
              NEW="v$MAJOR.$MINOR.$((PATCH + 1))"
            fi
            git tag "$NEW"
            git push origin "refs/tags/$NEW"
          fi
          echo "version=${NEW#v}" >> "$GITHUB_OUTPUT"

      - name: Image name
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: APP_VERSION=${{ steps.version.outputs.version }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:latest
