schema: spec-driven
references:
  - cdit
context: |
  FastMCP 4 server for Apple Music: catalog and library search, playlist
  management, and config-defined mirrored playlists kept as a rolling
  window of tracks from an external source (JSON feed, push webhook, or a
  Spotify playlist read with its owner's login). Two Apple transports: the
  documented Apple Music API first, the web-player API only for removal,
  rename and delete. Fleet conventions from the cdit store apply.
  Public repo: planning lives in the private cdit store; keep deployment
  specifics and personal details out of this repo.
